services:
  eureka:
    image: ${DOCKERHUB_USER:-localquiro}/quirosalud-eureka:${IMAGE_TAG:-dev}
    build: ./quirosalud-eureka-server
    ports: ["8761:8761"]
    networks: [quiro-internal]

  auth:
    image: ${DOCKERHUB_USER:-localquiro}/quirosalud-auth:${IMAGE_TAG:-dev}
    build: ./quirosalud-auth-service
    depends_on:
      eureka: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      DB_URL: jdbc:mysql://host.docker.internal:3306/bd_quiro_t3?useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-UXVpcm9TYWx1ZFNlZ3VyaWRhZEp3dFNlY3JldEtleTIwMjYh}
    ports: ["8081:8081"]
    networks: [quiro-internal]

  pacientes:
    image: ${DOCKERHUB_USER:-localquiro}/quirosalud-pacientes:${IMAGE_TAG:-dev}
    build: ./quirosalud-pacientes-service
    depends_on:
      eureka: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      DB_URL: jdbc:mysql://host.docker.internal:3306/bd_quiro_t3?useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-UXVpcm9TYWx1ZFNlZ3VyaWRhZEp3dFNlY3JldEtleTIwMjYh}
    ports: ["8082:8082"]
    networks: [quiro-internal]

  citas:
    image: ${DOCKERHUB_USER:-localquiro}/quirosalud-citas:${IMAGE_TAG:-dev}
    build: ./quirosalud-citas-service
    depends_on:
      eureka: { condition: service_started }
      pacientes: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      DB_URL: jdbc:mysql://host.docker.internal:3306/bd_quiro_t3?useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports: ["8083:8083"]
    networks: [quiro-internal]

  gateway:
    image: ${DOCKERHUB_USER:-localquiro}/quirosalud-gateway:${IMAGE_TAG:-dev}
    build: ./quirosalud-api-gateway
    depends_on:
      eureka: { condition: service_started }
      auth: { condition: service_started }
      pacientes: { condition: service_started }
      citas: { condition: service_started }
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    ports: ["8080:8080"]
    networks: [quiro-internal]

networks:
  quiro-internal: {}
