spring.application.name=quirosalud-api-gateway
server.port=8080

# Conexion al Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Ruta para Pacientes y Distritos
spring.cloud.gateway.server.webmvc.routes[0].id=pacientes-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://quirosalud-pacientes-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/pacientes/**,/api/v1/distritos/**

# Ruta para Auth
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://quirosalud-auth-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/auth/**

# Ruta para Citas y Consultas (Apunta al microservicio en puerto 8083)
spring.cloud.gateway.server.webmvc.routes[2].id=citas-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://quirosalud-citas-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/citas/**,/api/v1/consultas/**
