spring.application.name=quirosalud-api-gateway
# Puerto asignado en la Diapositiva 5
server.port=8080

# Conexion al Eureka Server
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enrutamiento dinamico MVC para los microservicios futuros
# Ruta para Seguridad (Auth Service)
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/auth/**

# Ruta para Catalogo (Producto Service)
spring.cloud.gateway.mvc.routes[1].id=producto-service
spring.cloud.gateway.mvc.routes[1].uri=lb://PRODUCTO-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/productos/**

# Ruta para Reservas (Cita Service)
spring.cloud.gateway.mvc.routes[2].id=cita-service
spring.cloud.gateway.mvc.routes[2].uri=lb://CITA-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/citas/**