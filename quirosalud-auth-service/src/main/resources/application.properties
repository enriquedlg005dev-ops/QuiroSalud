# Nombre alineado con el Gateway y Eureka
spring.application.name=quirosalud-auth-service

# Puerto aislado para el Auth
server.port=8081

# Conexion al Eureka
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Conexion a la base de datos (Credenciales reales del equipo)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_quiro_t3?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true