spring.application.name=auth-service

# Puerto para el Auth Service
server.port=8090

# Conexion al Eureka
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Conexion a la base de datos MySQL del proyecto
spring.datasource.url=jdbc:mysql://localhost:3306/bd_quiro_t3?userSSL=false
spring.datasource.username=root
spring.datasource.password=admin2024
# OJO: Cambia root y admin2024 por el usuario y clave de tu propio MySQL

# Configuracion de JPA/Hibernate para que cree las tablas si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true