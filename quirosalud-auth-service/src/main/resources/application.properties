spring.application.name=quirosalud-auth-service
server.port=${SERVER_PORT:8081}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_auth_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:quiro}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.bootstrap.name=${BOOTSTRAP_NAME:Administrador}
app.bootstrap.lastname=${BOOTSTRAP_LASTNAME:Inicial}
management.endpoints.web.exposure.include=health,info
