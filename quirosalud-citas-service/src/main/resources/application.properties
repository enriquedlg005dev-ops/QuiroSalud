server.port=8083
spring.application.name=quirosalud-citas-service

# Crea la BD sola si lo presentas en otra PC
spring.datasource.url=jdbc:mysql://localhost:3306/bd_quiro_t3?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = Crea las tablas automáticamente al correr el proyecto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator para observabilidad (Sílabo Unidad 3)
management.endpoints.web.exposure.include=health,info,metrics