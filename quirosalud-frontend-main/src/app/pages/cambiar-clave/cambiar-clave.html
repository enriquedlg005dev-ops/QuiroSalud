<div class="container py-4" style="max-width: 560px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="mb-3">Cambiar contraseña</h3>
      <p class="text-muted">Por seguridad, confirma tu contraseña actual. Al guardar, deberás iniciar sesión nuevamente.</p>
      <form (ngSubmit)="guardar()" #form="ngForm">
        <div class="mb-3">
          <label for="claveActual" class="form-label">Contraseña actual</label>
          <input id="claveActual" type="password" name="claveActual" autocomplete="current-password"
                 class="form-control" [(ngModel)]="claveActual" required />
        </div>
        <div class="mb-3">
          <label for="claveNueva" class="form-label">Nueva contraseña</label>
          <input id="claveNueva" type="password" name="claveNueva" autocomplete="new-password"
                 class="form-control" [(ngModel)]="claveNueva" required minlength="10" maxlength="128" />
          <small class="text-muted">Entre 10 y 128 caracteres. Usa una contraseña única.</small>
        </div>
        <div class="mb-3">
          <label for="confirmacion" class="form-label">Confirmar nueva contraseña</label>
          <input id="confirmacion" type="password" name="confirmacion" autocomplete="new-password"
                 class="form-control" [(ngModel)]="confirmacion" required />
        </div>
        @if (error) {
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        }
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid || procesando">
            {{ procesando ? 'Guardando...' : 'Guardar nueva contraseña' }}
          </button>
          <a routerLink="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
