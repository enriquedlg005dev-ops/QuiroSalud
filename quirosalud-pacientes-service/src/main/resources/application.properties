spring.application.name=quirosalud-pacientes-service
server.port=${SERVER_PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_pacientes_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:quiro}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
management.endpoints.web.exposure.include=health,info
